# Builds the Windows installer and the Android app (APK) in the cloud, for free, every time you
# upload a new copy of the project. Results appear under "Releases" in this repository.
# The repository needs only this file and capsule-link.zip (plus an optional branding folder with
# app-name.txt and app-icon.png). See docs/getting-the-apps.md.
name: Build the apps

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the project
        run: |
          if [ -f capsule-link.zip ]; then unzip -q capsule-link.zip -d unpacked; SRC=unpacked/capsule-link; else SRC=.; fi
          if [ -d branding ]; then cp -r branding "$SRC/branding"; fi
          echo "SRC=$SRC" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Build the APK
        env:
          CAPSULE_BUILD: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          cd "$SRC"
          # the same signing key every time, so a new APK installs over the old app (see mobile/native/signing)
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then mkdir -p mobile/native/signing; echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/native/signing/capsule-link.p12; fi
          node tools/apply-branding.mjs
          cd mobile
          npm install --no-audit --no-fund
          npm run android:init
          if [ -f ../branding/app-icon.png ]; then
            for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
              IFS=: read dens size fg <<< "$d"
              res=android/app/src/main/res/mipmap-$dens
              convert ../branding/app-icon.png -resize ${size}x${size} "$res/ic_launcher.png"
              convert ../branding/app-icon.png -resize ${size}x${size} "$res/ic_launcher_round.png"
              inner=$((fg * 66 / 108))
              convert ../branding/app-icon.png -resize ${inner}x${inner} -background none -gravity center -extent ${fg}x${fg} "$res/ic_launcher_foreground.png"
            done
          fi
          cd android
          # the app's own version on the APK (what Android shows under App info), from version.json
          VER=$(node -p "require('../../version.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${CAPSULE_BUILD:-1}/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" app/build.gradle
          echo "Building the Android app, version $VER (build ${CAPSULE_BUILD:-1})"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/phone-app.apk"
      - name: Phone update (the app fetches it by itself, no PC needed)
        env:
          CAPSULE_BUILD: ${{ github.run_number }}
        run: |
          cd "$SRC"
          ESBUILD_PATH="$PWD/mobile/node_modules/esbuild/lib/main.js" node tools/make-update.mjs --phone-only --out "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: "out/phone-*" }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the project
        shell: bash
        run: |
          if [ -f capsule-link.zip ]; then unzip -q capsule-link.zip -d unpacked; SRC=unpacked/capsule-link; else SRC=.; fi
          if [ -d branding ]; then cp -r branding "$SRC/branding"; fi
          echo "SRC=$SRC" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build the installer
        shell: bash
        run: |
          cd "$SRC"
          node tools/apply-branding.mjs
          cd desktop
          npm install --no-audit --no-fund
          npm run dist
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp release/*.exe "$GITHUB_WORKSPACE/out/pc-app-setup.exe"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/pc-app-setup.exe }

  release:
    needs: [android, windows]
    # publish the phone app even when the Windows build fails (and the other way round), so one broken
    # build never leaves Releases stuck on an old version
    if: ${{ !cancelled() && (needs.android.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Which version this is
        run: |
          VER=$(node -p "try { require('./out/phone-update-info.json').version } catch { 'unknown' }")
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "ANDROID=${{ needs.android.result }}" >> "$GITHUB_ENV"
          echo "WINDOWS=${{ needs.windows.result }}" >> "$GITHUB_ENV"
          ls -la out
      - name: Replace the old release (a fresh one each time, on this upload)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release delete latest-build --cleanup-tag --yes --repo "${{ github.repository }}" || true
      - name: Publish under Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          target_commitish: ${{ github.sha }}
          name: "Latest build: v${{ env.VER }} (#${{ github.run_number }})"
          fail_on_unmatched_files: false
          body: |
            Version ${{ env.VER }}, build ${{ github.run_number }}. Android: ${{ env.ANDROID }}. Windows: ${{ env.WINDOWS }}.

            pc-app-setup.exe: run it on your Windows PC (Windows may warn about an unknown publisher: More info → Run anyway).
            phone-app.apk: open it on your Android phone (allow installing apps from your browser or files app when asked). It installs over the old app (same signing key), or let the app fetch it: PC Link → New builds from GitHub.
            phone-update.json: the phone app's own update. The app fetches it by itself and installs it in a few seconds, without the PC (only when the Android part changed does it need the APK).
          files: |
            out/pc-app-setup.exe
            out/phone-app.apk
            out/phone-update.json
            out/phone-update-info.json
          make_latest: true
